<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub Watch</title>
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    .stage { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
    @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
    .player { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
    .player > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .player .empty { display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px; }
    .members { display: flex; flex-wrap: wrap; gap: 6px; }
    .member { display: flex; align-items: center; gap: 6px; background: var(--bg-2); border-radius: 999px; padding: 3px 10px 3px 3px; font-size: .85rem; }
    .member .avatar { width: 24px; height: 24px; font-size: .65rem; }
    .member.speaking .avatar { box-shadow: 0 0 0 2px var(--ok), 0 0 10px var(--ok); }
    .queue .list-item { font-size: .85rem; }
    .queue .list-item .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .switch { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
    .switch input { width: auto; }
  </style>
</head>
<body data-app="watch">
  <main class="container">
    <section id="lobby" class="grid cols-2" style="align-items:start">
      <div class="card">
        <h1>🍿 Watch</h1>
        <p class="muted">Смотрите видео вместе с друзьями где угодно: пауза, перемотка и смена видео синхронизируются у всех. Плюс чат и очередь видео.</p>
        <form id="join-form">
          <label for="room">Комната</label>
          <input id="room" name="room" placeholder="например, movie-night" required pattern="[a-zA-Z0-9_\-]{1,40}">
          <label for="password">Пароль (необязательно, только Premium)</label>
          <input id="password" name="password" type="password" autocomplete="off">
          <button class="btn" style="width:100%;margin-top:14px" data-testid="join-watch">Войти в комнату</button>
        </form>
      </div>
      <div class="card">
        <div class="row"><h2 class="grow">Сейчас смотрят</h2><button class="btn ghost sm" id="refresh">↻</button></div>
        <div class="list" id="rooms"><p class="muted">Загрузка…</p></div>
      </div>
    </section>

    <section id="room-view" class="hidden">
      <div class="stage">
        <div class="grid" style="gap:12px">
          <div class="player" id="player"><div class="empty">Вставьте ссылку на YouTube или видео ниже ⬇️</div></div>
          <form class="row" id="url-form">
            <input name="url" placeholder="https://youtube.com/watch?v=… или ссылка на .mp4" class="grow" data-testid="url-input">
            <button class="btn" name="now" value="load" data-testid="play-now">▶ Сейчас</button>
            <button class="btn ghost" name="queue" value="queue-add">+ В очередь</button>
          </form>
          <div class="card tight">
            <div class="row">
              <h3 class="grow" id="room-title" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></h3>
              <button class="btn danger sm" id="leave">Выйти</button>
            </div>
            <div class="row wrap" style="margin-top:10px">
              <button class="btn sm" id="voice-toggle" data-testid="voice-toggle">🎙 Включить голос</button>
              <button class="btn ghost sm hidden" id="voice-mute" data-testid="voice-mute" title="Выключить микрофон">🔇</button>
              <button class="btn ghost sm" id="call-friends">👥 Позвать</button>
              <button class="btn ghost sm" id="invite">🔗 Ссылка</button>
              <label class="switch hidden" id="host-only-wrap"><input type="checkbox" id="host-only"> Управляет только ведущий</label>
            </div>
            <div class="members" id="members" style="margin-top:10px" data-testid="members"></div>
          </div>
          <div class="card tight queue">
            <div class="row"><h3 class="grow" style="margin:0">Очередь</h3><button class="btn sm ghost" id="next">⏭ Следующее</button></div>
            <div class="list" id="queue" style="margin-top:8px"></div>
          </div>
        </div>
        <div class="card"><h3>Чат</h3><div id="chat"></div></div>
      </div>
    </section>
  </main>
  <script type="module" src="/watch/watch.js"></script>
</body>
</html>
