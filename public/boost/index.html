<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub Boost</title>
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .game { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; color: var(--text); font: inherit; }
    .game.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .game .plat { font-size: .75rem; color: var(--muted); }
    .node { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 12px; align-items: center; }
    @media (max-width: 600px) { .node { grid-template-columns: 1fr auto auto; } .node .hide-sm { display: none; } }
    .node.best { outline: 1px solid var(--accent); }
    .metric { font-variant-numeric: tabular-nums; text-align: right; min-width: 56px; }
    .metric small { display: block; color: var(--muted); font-size: .7rem; }
    .good { color: var(--ok); } .mid { color: var(--warn); } .badv { color: var(--bad); }
    .boost-btn { width: 160px; height: 160px; border-radius: 50%; font-size: 1.3rem; margin: 8px auto; display: grid; place-items: center; box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 50%, transparent); }
    .boost-btn.on { background: var(--bad); box-shadow: 0 0 40px color-mix(in srgb, var(--bad) 50%, transparent); }
    canvas { width: 100%; height: 120px; background: var(--bg-2); border-radius: 10px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stats b { font-size: 1.4rem; display: block; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body data-app="boost">
  <main class="container">
    <h1>⚡ Boost</h1>
    <p class="muted">Ускоритель игр: подбираем узел нашей сети с минимальным пингом и стабильным соединением, чтобы трафик игры шёл по быстрому маршруту, а не через перегруженные пути провайдера.</p>
    <div class="grid cols-2" style="align-items:start">
      <div class="grid">
        <div class="card">
          <h2>1. Игра</h2>
          <input id="search" placeholder="Поиск игры…" style="margin-bottom:10px">
          <div class="games" id="games"></div>
        </div>
        <div class="card">
          <div class="row"><h2 class="grow">2. Узел</h2><button class="btn ghost sm" id="test" data-testid="test-nodes">Проверить пинг</button></div>
          <div class="list" id="nodes"></div>
          <p class="muted small" id="multipath"></p>
        </div>
      </div>
      <div class="card" style="text-align:center">
        <h2>3. Ускорение</h2>
        <p class="muted small" id="summary">Выберите игру и узел</p>
        <button class="btn boost-btn" id="boost" data-testid="boost" disabled>УСКОРИТЬ</button>
        <div class="stats" style="margin:12px 0">
          <div><b id="s-ping">—</b><span class="muted small">пинг, мс</span></div>
          <div><b id="s-jitter">—</b><span class="muted small">джиттер, мс</span></div>
          <div><b id="s-loss">—</b><span class="muted small">потери</span></div>
        </div>
        <canvas id="chart" width="600" height="120" aria-label="График пинга"></canvas>
        <p class="muted small" id="session-info" style="text-align:left;margin-top:12px"></p>
      </div>
    </div>
  </main>
  <script type="module" src="/boost/boost.js"></script>
</body>
</html>
